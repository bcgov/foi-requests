name: Release to Prod

on:
  workflow_dispatch:
    inputs:
      release_label:
        description: Release label (you provided in PR to main for example 1.2.0)
        required: true
        type: string

      release_version:
        description: Semantic version to publish to prod (for example v1.2.0)
        required: true
        type: string

jobs:

  release:
    name: Promote Release To Production
    runs-on: ubuntu-latest

    steps:

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

     # Add deploy key to runner
      - name: Setup SSH
        shell: bash
        env:
          MANIFEST_REPO_DEPLOY_KEY: ${{ secrets.MANIFEST_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "${MANIFEST_REPO_DEPLOY_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts

      # Checkout Gitops repo 
      - name: Checkout Gitops
        shell: bash
        run: |
          git clone git@github.com:bcgov-c/tenant-gitops-04d1a3.git -b main

      # Find services for the given release label in values-test.yaml
      - name: Find release services
        id: services
        working-directory: tenant-gitops-04d1a3
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          VALUES_FILE: "foi-requests/values-test.yaml"
        run: |

          services=$(yq -o=json '
            pick(["deployments","cronJobs"])
            | to_entries
            | map(
                .key as $kind
                | .value
                | to_entries
                | map(
                    select(.value.labels."release-label" == env(RELEASE_LABEL))
                    | {
                        "kind": $kind,
                        "name": .key,
                        "imagestream": (.value.image.repository | split("/") | .[-1]),
                        "tag": .value.image.tag,
                        "backup-required": (.value.labels."db-backup-required" == "true")
                      }
                  )
              )
            | flatten
          ' "$VALUES_FILE")


          if [ "$(echo "$services" | jq length)" -eq 0 ]; then
            echo "No services found"
            exit 1
          fi


          echo "$services" | jq

          echo "services=$(echo "$services" | jq -c .)" >> "$GITHUB_OUTPUT"

      # login to tool's registry

     # Install OC CLI
      - name: Install OC CLI
        uses: redhat-actions/oc-installer@35b60c3f9757ae4301521556e1b75ff6f59f8d7c
        with:
          oc_version: '4.6'

      # Login and verify every service from the deployment matrix.
      - name: Login to OpenShift
        run: |
          oc login \
            --server="${{ secrets.OPENSHIFT4_LOGIN_REGISTRY }}" \
            --token="${{ secrets.OPENSHIFT4_SA_TOKEN }}"

      # Perform DB backup if release touches api
      - name: Perform DB backup if release touches api
        env: 
          SERVICES: ${{ steps.services.outputs.services }}
          NAMESPACE: 04d1a3-prod
          BACKUP_DEPLOYMENT: foi-docreviewer-bkup
        run: |
          
          # Check if any service in the JSON array has db_backup_required set to true
          BACKUP_NEEDED=$(echo "$SERVICES" | jq -r 'any(.[]; .["backup-required"] == true)')

          if [ "$BACKUP_NEEDED" = "true" ]; then
            echo "DB backup is required for this release."
            # 1. Target the correct namespace
            oc project ${NAMESPACE}

            echo "Locating running pod for deployment ${BACKUP_DEPLOYMENT}"

            # 2. Find the active running pod name for the deployment
            BACKUP_POD=$(oc get pods -n "${NAMESPACE}" \
              -l deployment=${BACKUP_DEPLOYMENT} \
              --field-selector=status.phase=Running \
              -o jsonpath='{.items[0].metadata.name}')

            if [ -z "$BACKUP_POD" ]; then
              echo "No running '${BACKUP_DEPLOYMENT}' pod found in namespace '${NAMESPACE}'!"
              exit 1
            fi

            echo "Found backup pod: $BACKUP_POD"

            # 3. Execute the backup script inside the pod
            # Replace '/app/backup.sh' with the actual script path inside your container
            oc exec -n "${NAMESPACE}" "$BACKUP_POD" -- /bin/sh -c "/backup.sh -1"

            echo "Database backup completed successfully!"

          else
            echo "No DB backup is required for this release."
          fi
          
      # retal all the service imagestreams to resease version
      - name: Retag images in Imagestream
        env: 
          RELEASE_VERSION: ${{ inputs.release_version }}
          NAMESPACE: ${{ secrets.OPENSHIFT_TOOLS_NAMESPACE }}
          
        run: |

          oc project "$NAMESPACE"
          
          echo '${{ steps.services.outputs.services }}' |
            jq -c '.[]' |
            while IFS= read -r service
            do
                IMAGE_NAME=$(echo "$service" | jq -r '.imagestream')
                CURRENT_TAG=$(echo "$service" | jq -r '.tag')

                echo "Tagging ${IMAGE_NAME}:${CURRENT_TAG} -> ${IMAGE_NAME}:${RELEASE_VERSION}"

                oc tag \
                  "${IMAGE_NAME}:${CURRENT_TAG}" \
                  "${IMAGE_NAME}:${RELEASE_VERSION}"
            done

      - name: Promote images in GitOps
        working-directory: tenant-gitops-04d1a3
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_LABEL: ${{ inputs.release_label }}
          VALUES_FILE: "foi-requests/values-prod.yaml"
          SERVICES: ${{ steps.services.outputs.services }}
        shell: bash
        run: |
          printf '%s\n' "$SERVICES" |
          jq -c '.[]' |
          while IFS= read -r service; do

            export KIND=$(echo "$service" | jq -r '.kind')
            export NAME=$(echo "$service" | jq -r '.name')
            export TAG=$(echo "$service" | jq -r '.tag')

            echo "Promoting ${KIND}/${NAME}: ${TAG} -> ${RELEASE_VERSION}"

            yq e \
              '.[strenv(KIND)][strenv(NAME)].image.tag = strenv(RELEASE_VERSION)' \
              -i "$VALUES_FILE"

          done

          git config user.email "manish.sihag@gov.bc.ca"
          git config user.name "ManishSihag"

          git add "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No GitOps changes."
            exit 0
          fi

          git commit -m "Release ${RELEASE_VERSION} (from ${RELEASE_LABEL})"

          MAX_RETRIES=5
          RETRY_DELAY=15

          for ((i=1; i<=MAX_RETRIES; i++)); do
            if git push; then
              break
            fi

            if [ "$i" -eq "$MAX_RETRIES" ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi

            sleep "$RETRY_DELAY"
            git pull --rebase origin main
          done
